[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alfworld-self-improvement"
version = "0.1.0"
description = "Modular research framework for self-improving language models in ALFWorld."
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "ALFWorld Research"}]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
